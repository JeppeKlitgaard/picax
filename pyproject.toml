[project]
name = "picax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax>=0.11.0",
    "jaxtyping>=0.3.11",
]

[tool.ruff.lint]
extend-select = [
    "E",
    "F",
    "I",
]

ignore = [
    "F722",  # https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "types" },
]
lint = [
    "ruff>=0.16.6",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    { include-group = "test-deps" },
]
test-deps = [
    "scikit-image>=0.26.0",
]
types = [
    "pyrefly>=1.3.0.dev4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"
